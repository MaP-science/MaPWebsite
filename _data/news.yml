- date: 02/12/24
  headline: "Job Opportunity: PhD position in Machine Learning for Neuronal Feature Identification in 3D Microscopic Imaging - DTU Compute [Expired]"
  title: "PhD position in Machine Learning for Neuronal Feature Identification in 3D Microscopic Imaging [Expired]"
  logo: DTU
  tags:
    - job opportunity
    - light-sheet microscopy
    - phd 
  content: Do you want to join a multidisciplinary team working with a new 3D optical imaging technology and develop machine learning models to map in the brain neuronal and cellular objects, their geometry, density and organization? Are you interested in learning about 3D imaging analysis, brain anatomy, collect your own high-quality microscopic data as well as generating synthetic cellular environments to evaluate and train your model? Are you intrigued by solving challenges working with big data? Are you eager to develop innovative solutions in a groundbreaking project at the intersection of neuroimaging and machine learning? If yes, we encourage you to apply and join our team! For more info & to apply, <a href="https://efzu.fa.em2.oraclecloud.com/hcmUI/CandidateExperience/en/sites/CX_1/job/4412/?utm_medium=jobshare">click here</a> or contact Professor Tim B. Dyrby at timd@drcmr.dk

- date: 19/11/24
  headline: "The new Handbook of Diffusion MR Tractography book is out"
  title: "The new Handbook of Diffusion MR Tractography book is out with contribution from Professor Tim Dyrby"
  logo: DRCMR
  tags:
    - book
  content: The new Handbook of Diffusion MR Tractography book is out with a contribution from Professor Tim Dyrby. The book provides a comprehensive overview of the state-of-the-art in diffusion MRI tractography. Specifically, we focus on the three chapters on Validation and future directions that we contributed with - written together with many collogues. Check out Chapters <a href="https://doi.org/10.1016/B978-0-12-818894-1.00017-3">25</a>, <a href="https://doi.org/10.1016/B978-0-12-818894-1.00020-3">26</a>, and <a href="https://doi.org/10.1016/B978-0-12-818894-1.00004-5">27</a>.

