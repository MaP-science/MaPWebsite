- date: 22/09/25
  headline: "MaP at ESMRMB 2025: Microstructural Imaging pre-congress & Mariam’s talk"
  title: "MaP at ESMRMB 2025: Pre-congress Workshop and Conference Highlights"
  logo: DRCMR
  tags:
    - conference
    - workshop
    - talks
  content: |
    The ESMRMB main conference takes place in Marseille on 8–11 October 2025. The pre-congress day features a dedicated workshop on Microstructural Imaging.<br><br>
    <strong>MaP highlights</strong><br>
    &bull; MaP team members Marco and Emma are part of the organising committee for the pre-congress workshop on microstructural imaging.<br>
    &bull; MaP’s Mariam will present at talk entitled: <em>“Virtual Tissues, Real Insights: Simulating Biological Microstructure for MRI”</em> at the Microstructural Imaging Workshop.<br>
    &bull; MaP's Miren will present a poster entitled: <em>"Quantifying and Correcting Axonal Shrinkage in Transmission Electron Microscopy: Cryo-Fixation vs. Epon-Embedding" </em> at the main conference.<br><br>
    Learn more and see the workshop details on the official site: <a href="https://esmrmb2025.org/precongress-workshops/">esmrmb2025.org/precongress-workshops</a>.

