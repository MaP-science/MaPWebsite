- date: 21/08/24
  headline: "Job Opportunity: Postdoc in Brain-Circuit Conduction Velocity Mapping [Expired]"
  title: "Postdoc in Brain-Circuit Conduction Velocity Mapping [Expired]"
  logo: DRCMR
  tags:
    - job opportunity
    - microstructure
    - postdoc 
  content: Are you passionate about unraveling how brain diseases impact communication speed between brain regions? Ready to explore the brain’s microstructure and its role in health and disease? Join us at the Danish Research Centre for Magnetic Resonance (DRCMR) in Copenhagen! 🧠🔬 We’re seeking a 3-year postdoc supported by the ERC to work on cutting-edge MRI research focused on brain conduction velocity. You’ll work with translational animal models, advanced imaging techniques, and be part of a dynamic, multidisciplinary team. For more info & to apply, visit drcmr.dk or contact Professor Tim B. Dyrby at timd@drcmr.dk


