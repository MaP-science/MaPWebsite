- date: 05/02/25
  headline: "Video: Did you know? Zooming into an MRI voxel, axons appear organized as laminar structures—even when crossing!"
  title: "Did you know? Zooming into an MRI voxel, axons appear organized as laminar structures—even when crossing!"
  logo: DTU
  tags:
    - linkedin
  content: |
    From Linkedin: 🧠🔬 Our latest research, published in eLife, shows that diffusion MRI and x-ray synchrotron imaging detect the same microstructural anisotropy, providing new insights into white matter organization across scales. Explore the full study <a href="https://lnkd.in/d5Pg-XYs">here</a>.
    
